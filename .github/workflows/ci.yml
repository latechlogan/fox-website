# CI workflow - runs build check on every PR targeting main
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # bump from 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npx astro check
